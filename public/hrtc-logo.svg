<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22234" />
      <stop offset="100%" stop-color="#8B1A2A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AC0D" />
      <stop offset="100%" stop-color="#F1C40F" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E8E8" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#1A5276" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Mountain Silhouette -->
  <!-- Back mountain range -->
  <path d="M 20 135 L 60 85 L 90 120 L 130 75 L 180 135 Z" fill="#1A5276" opacity="0.6"/>
  <!-- Front snow-capped mountain range -->
  <polygon points="35,140 75,70 110,120 150,60 175,140" fill="url(#snowGrad)"/>
  <!-- Snow caps -->
  <polygon points="75,70 65,88 72,85 75,90 78,85 85,88" fill="#FFFFFF"/>
  <polygon points="150,60 138,80 146,76 150,82 154,76 162,80" fill="#FFFFFF"/>

  <!-- Road / Highway Curve -->
  <path d="M 20 145 C 70 125, 130 165, 180 140 L 180 155 C 130 180, 70 140, 20 160 Z" fill="url(#goldGrad)"/>
  <path d="M 30 150 C 70 135, 130 170, 170 148" fill="none" stroke="#B22234" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- HRTC Text Band -->
  <circle cx="100" cy="100" r="92" fill="none" id="textPathCircle"/>

  <!-- Center HRTC Acronym Banner -->
  <rect x="40" y="152" width="120" height="28" rx="6" fill="#1A5276" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="100" y="172" font-family="'Inter', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">HRTC</text>

  <!-- Top Curved Text -->
  <path id="curve" fill="none" d="M 30,100 A 70,70 0 1,1 170,100" />
  <text font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      HIMACHAL ROAD TRANSPORT CORP
    </textPath>
  </text>
</svg>
